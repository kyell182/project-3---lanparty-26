<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN-Party 26 — Player Registration</title>
<style>
  :root {
    --bg: #0b0f1f;
    --pane: #151c33;
    --rand: #2f3d63;
    --accent: #22d3ee;
    --groen: #22e07c;
    --rood: #ff4d6d;
    --text: #eef2ff;
    --sub: #94a0c0;
    --radius: 4px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .kaart { background: var(--pane); border: 1px solid var(--rand); border-radius: var(--radius);
    padding: 32px 36px; width: min(440px, 92vw); }
  h1 { font-size: 1.5rem; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  h1 span { color: var(--accent); }
  p { color: var(--sub); font-size: .95rem; margin: 8px 0 20px; }
  input { width: 100%; padding: 12px 14px; background: #0b0f1f; color: var(--text);
    border: 1px solid var(--rand); border-radius: 2px; font-size: 1.05rem; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { width: 100%; margin-top: 16px; padding: 12px; background: var(--accent); color: #0b0f1f;
    border: 0; border-radius: 2px; font-size: 1.05rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
  button:hover { filter: brightness(1.15); }
  #melding { display: none; margin-top: 14px; padding: 10px 14px; border-radius: 2px; font-size: .9rem; }
  #melding.ok { display: block; background: #10281c; color: var(--groen); }
  #melding.fout { display: block; background: #2d1216; color: var(--rood); }
</style>
</head>
<body>
<div class="kaart">
  <h1><span>LAN</span>-PARTY <span>26</span></h1>
  <p>Enter Player name for the leaderboard.</p>
  <input id="naam" maxlength="40" autocomplete="off">
  <button id="verzenden">Register</button>
  <div id="melding"></div>
</div>
<script>
document.getElementById("verzenden").onclick = async () => {
  const m = document.getElementById("melding");
  const r = await fetch("/api/speler", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ naam: document.getElementById("naam").value }),
  });
  const d = await r.json();
  if (d.ok && d.nieuw === false) {
    m.textContent = "That name is already registered. You can start playing under it — or pick another name if it was a mistake.";
    m.className = "fout";
  } else if (d.ok) {
    m.textContent = d.gebruikt >= d.limit
      ? "Registered! This device has reached its limit of " + d.limit + " player names."
      : "Registered! Your name appears on the screen with your first score.";
    m.className = "ok";
  } else {
    m.textContent = d.fout || "Try again.";
    m.className = "fout";
  }
};
document.getElementById("naam").addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("verzenden").click(); });
document.getElementById("naam").focus();
</script>
</body>
</html>
