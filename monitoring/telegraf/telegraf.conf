# Telegraf verzamelt elke 10 seconden metingen en schrijft ze naar InfluxDB.
# Waarden met ${NAAM} komen uit de omgevingsvariabelen in docker-compose.yml.

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# --- Netwerkapparaten via SNMP ---
# Nummerieke OIDs, zodat er geen MIB-bestanden in de container nodig zijn.
# De apparaten staan niet hier maar in .env bij SNMP_APPARATEN. start.sh zet de lijst om.
# Een extra switch toevoegen: zet het IP erbij in .env en draai docker compose up -d.
[[inputs.snmp]]
  agents = ${SNMP_AGENTS}
  version = 2
  community = "${SNMP_COMMUNITY}"
  agent_host_tag = "agent_host"
  # Kort houden: een apparaat dat niet antwoordt, vertraagt anders de meting van alle andere.
  # Op een LAN zijn pakketten zelden kwijt, dus 2 s en 1 nieuwe poging is ruim genoeg.
  timeout = "2s"
  retries = 1

  [[inputs.snmp.field]]
    name = "sysName"
    oid = "1.3.6.1.2.1.1.5.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid = "1.3.6.1.2.1.1.3.0"

  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["sysName"]

    [[inputs.snmp.table.field]]
      name = "ifName"
      oid = "1.3.6.1.2.1.31.1.1.1.1"
      is_tag = true

    # 1 = up, 2 = down
    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "1.3.6.1.2.1.2.2.1.8"

    # 64-bit tellers, want 32-bit tellers lopen bij 1 Gbps binnen een halve minuut over.
    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = "1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = "1.3.6.1.2.1.31.1.1.1.10"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = "1.3.6.1.2.1.2.2.1.14"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = "1.3.6.1.2.1.2.2.1.20"

# --- Latency, jitter en packet loss ---
[[inputs.ping]]
  urls = ${PING_URLS}
  method = "native"
  count = 3
  ping_interval = 1.0
  timeout = 2.0

# --- De server zelf ---
[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

